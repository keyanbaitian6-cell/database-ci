name: Regression checks
# Minutes come from the free plan (2,000/month; Windows counts double). See AGENTS.md "GitHub Actions".
# A push or PR that only changes Markdown docs (AI_COLLABORATION.md, plans, specs) runs nothing:
# no test, build or stage script reads a .md from the repository, so the result would equal the
# previous commit's. Any change that also touches another file runs everything as before.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
permissions:
  contents: read

jobs:
  pc:
    runs-on: ${{ matrix.os }}
    # A hung test would otherwise run to GitHub's 360-minute default (Windows counts double) and use
    # most of the month's free minutes. Recent runs: pc 1-5 minutes, full about 16 minutes (2026-11-05).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Asia/Tokyo is covered on Linux by the full job (same Python 3.12, requirements, xvfb, TZ and
      # both PC suites through check_before_build.sh). Windows Python ignores TZ=Asia/Tokyo (an IANA
      # name the C runtime cannot read) and keeps the runner's UTC, so the Windows Tokyo job was a
      # second Windows UTC run at double cost (checked 2026-10-18: TZ=America/New_York changes nothing).
      matrix:
        include:
          - {os: ubuntu-latest, timezone: UTC}
          - {os: windows-latest, timezone: UTC}
    env:
      TZ: ${{ matrix.timezone }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: database/requirements.txt
      - run: python -m pip install -r database/requirements.txt
      - name: Linux Tk display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Python regression suites
        shell: bash
        working-directory: database
        run: |
          set -euo pipefail
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a); fi
          # PCの試験はすべて tests/ にある（2026-11-01に database/ 直下の test_*.py を移した）。
          "${display[@]}" python -m unittest discover -s tests
      # 実行制御はWindowsのローカル確認にも使うため、追加の7件だけをこちらでも確認する。
      # Ubuntu側ではfullが同じ制御を確認するので重複させない。Windowsは分数が2倍。
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '24'
      - name: 試験の実行制御を確認（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: node --test database_android/tool/test_run_js_checks.mjs

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
      DASH__SUPPRESS_ANALYTICS: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CHECK_JS_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: database/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned development tools
        shell: bash
        run: |
          set -euo pipefail
          python -m venv database/.venv
          database/.venv/bin/python -m pip install -r database/requirements.txt
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 6655482ec06e547f90abf8ae7590466f4415978d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/browser-tests" playwright@1.62.1
          node "$RUNNER_TEMP/browser-tests/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=file://$RUNNER_TEMP/browser-tests/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          cp database_android/assets/database_seed.example.json database_android/assets/database_seed.json
      - name: Complete pre-build gate
        run: xvfb-run -a bash database_android/tool/check_before_build.sh
      - name: 検証の所要時間を表示
        if: always()
        run: |
          if [ -f database_android/build/check_before_build/timings.md ]; then
            cat database_android/build/check_before_build/timings.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 検証の所要時間を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-timings
          path: |
            database_android/build/check_before_build/timings.*
            database_android/build/check_before_build/js-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve failed regression logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-full-logs
          path: database_android/build/check_before_build/*.log
          if-no-files-found: ignore
          retention-days: 7
